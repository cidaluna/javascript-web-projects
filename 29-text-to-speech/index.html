<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Text to Speech | Cida Luna</title>
</head>
<body>
    <div class="container">
        <p class="header">Text To Speech</p>
        <textarea id="inputTextarea" placeholder="Write anything here..."></textarea>
        <select id="voices"></select>
        
        <div class="buttons">
            <button class="btn clear" id="clear" >Clear</button>
            <button class="btn convert" id="convert">
                <i class="fa-solid fa-microphone-lines"></i>
                Speech</button>
        </div>
    </div>
    <p class="status">Mozilla Firefox does not support the Voices Speech List</p>
    
    <script src="script.js"></script>
</body>
</html>
