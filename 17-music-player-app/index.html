<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Music Player App | Cida Luna</title>
</head>

<body>
    <!-- Font Awesome https://cdnjs.com/libraries/font-awesome -->
    <div class="background">
        <img src="./assets/1.jpg" id="bg-img">
    </div>

    <div class="container">
        <div class="player-img">
            <img src="./assets/1.jpg" class="active" id="cover">
        </div>


        <h2 id="music-title">Test</h2>
        <h3 id="music-artist">Test h3</h3>

        <div class="player-progress" id="player-progress">
            <div class="progress" id="progress"></div>
            <div class="music-duration">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <i class="fa-solid fa-backward" title="Previous" id="prev"></i>
            <i class="fa-solid fa-play play-button" title="Play" id="play"></i>
            <i class="fa-solid fa-forward" title="Next" id="next"></i>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
