<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Text Editor with Javascript | Cida Luna Front-end Developer - Brazil</title>
</head>
<body>
    <div class="container">
        <p class="header">Text Editor</p>
        <div class="options">
            <button id="bold" class="option-button format">
                <i class="fa-solid fa-bold"></i>
            </button>
            <button id="superscript" class="option-button script">
                <i class="fa-solid fa-superscript"></i>
            </button>
            <button id="subscript" class="option-button script">
                <i class="fa-solid fa-subscript"></i>
            </button>
            <button id="orderedlist" class="option-button ">
                <i class="fa-solid fa-list-ol"></i>
            </button>
            <button id="unorderedlist" class="option-button ">
                <i class="fa-solid fa-list"></i>
            </button>
            <button id="left" class="option-button format">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="right" class="option-button format">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <button id="link" class="option-button format">
                <i class="fa-solid fa-link"></i>
            </button>
            <button id="linkslash" class="option-button format">
                <i class="fa-solid fa-link-slash"></i>
            </button>
            <button id="alignleft" class="option-button format">
                <i class="fa-solid fa-align-left"></i>
            </button>
            <button id="justify" class="option-button format">
                <i class="fa-solid fa-align-justify"></i>
            </button>
            <button id="link" class="option-button format">
                <i class="fa-solid fa-align-right"></i>
            </button>
            <select id="formatBlock" class="adv-options-button">
                <option value="H1">H1</option>
                <option value="H2">H2</option>
                <option value="H3">H3</option>
                <option value="H4">H4</option>
                <option value="H5">H5</option>
                <option value="H6">H6</option>
            </select>
            <select id="formatFontName" class="adv-options-button"></select>
            <select id="formatFontSize" class="adv-options-button"></select>

            <div class="input-wrapper">
                <input type="color" id="foreColor" class="adv-options-button">
                <label for="foreColor">Font Color</label>
            </div>
            <div class="input-wrapper">
                <input type="color" id="backColor" class="adv-options-button">
                <label for="backColor">Background Color</label>
            </div>
        </div>
        <div id="text-input" contenteditable="true"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
